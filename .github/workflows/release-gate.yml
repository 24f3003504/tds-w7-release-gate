name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TDS identity: 24f3003504@ds.study.iitm.ac.in
        run: echo "TDS identity: 24f3003504@ds.study.iitm.ac.in"

      - name: Run tests
        run: npm test
